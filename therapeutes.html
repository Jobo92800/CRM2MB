<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>MAbeautyplus — Mes appels</title>
<link rel="stylesheet" href="assets/da-tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; }
  .cache { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ====================== Connexion ====================== */
  #connexion { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-5); }
  .carte-connexion { width: 100%; max-width: 440px; background: var(--blanc); border: 1px solid var(--filet);
    border-radius: var(--radius-encadre); padding: var(--space-7) var(--space-6); text-align: center;
    box-shadow: var(--ombre-flottante); }
  .carte-connexion img { width: 170px; height: auto; margin-bottom: var(--space-5); }

  /* ====================== Ossature ====================== */
  #espace { min-height: 100vh; display: flex; flex-direction: column; }

  /* En-tête sur la surface profonde : c'est le repère de l'application. */
  header.barre { flex: none; background: var(--degrade-profond); color: #fff;
    padding: var(--space-4) var(--space-6); display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; }
  .marque { display: inline-flex; align-items: center; gap: 10px; }
  .marque img { height: 30px; width: auto; }
  /* Mot-symbole recomposé : la charte l'admet dans une barre d'en-tête d'application. */
  .marque span { font: 600 20px/20px var(--font-sans); letter-spacing: -.01em; color: #fff; }
  .marque span i { font-style: normal; font-weight: 400; color: var(--aqua-clair); }
  .barre-rubrique { font: 600 11px/16px var(--font-sans); letter-spacing: .14em; text-transform: uppercase;
    color: var(--aqua-clair); }
  .barre-droite { margin-left: auto; display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
  .jeton-centre { display: inline-flex; align-items: center; gap: 8px; border-radius: var(--radius-pilule);
    padding: 7px 16px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.2);
    font: 600 14px/18px var(--font-sans); color: #fff; }
  .jeton-centre .pastille { width: 8px; height: 8px; border-radius: var(--radius-pilule); background: var(--aqua-clair); }
  .champ-barre { width: 140px; height: 38px; padding: 0 14px; border: 1px solid rgba(255,255,255,.2);
    border-radius: var(--radius-pilule); font: 600 14px/38px var(--font-sans); color: #fff;
    background: rgba(255,255,255,.09); transition: border-color .18s ease, background-color .18s ease; }
  .champ-barre::placeholder { color: var(--profond-source); font-weight: 400; }
  .champ-barre.a-remplir { border-color: var(--aqua-clair); background: rgba(255,255,255,.18); }
  select.champ-barre { width: auto; min-width: 128px; max-width: 180px; cursor: pointer;
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat; background-position: right 12px center; background-size: 10px 7px;
    padding-right: 30px; }
  select.champ-barre option, select.champ-barre optgroup { color: var(--encre); background: var(--blanc); }
  .lien-barre { font: 500 14px/14px var(--font-sans); background: none; border: none; color: var(--profond-doux);
    cursor: pointer; padding: 8px; font-family: var(--font-sans); transition: color .18s ease; }
  .lien-barre:hover { color: #fff; }

  main.espace-corps { flex: 1; display: grid; grid-template-columns: 400px 1fr; min-height: 0; }
  .colonne-liste { border-right: 1px solid var(--filet); display: flex; flex-direction: column; min-height: 0;
    background: var(--wash); }
  .liste-entete { padding: var(--space-5) var(--space-5) var(--space-4); flex: none; }
  .liste-defile { overflow-y: auto; padding: 0 var(--space-5) var(--space-6); display: flex; flex-direction: column; gap: var(--space-3); }
  .colonne-fiche { overflow-y: auto; padding: var(--space-6) var(--space-6) 140px; }
  .fiche-largeur { max-width: 780px; margin: 0 auto; }

  /* ====================== Compteurs ====================== */
  .rangee-compteurs { display: flex; gap: var(--space-3); margin-top: var(--space-4); }
  .compteur { flex: 1; background: var(--blanc); border: 1px solid var(--filet); border-radius: var(--radius-champ);
    padding: 10px 12px; }
  .compteur b { display: block; font: 600 20px/24px var(--font-sans); color: var(--encre); }
  .compteur span { font: 400 11px/15px var(--font-sans); color: var(--gris); }

  /* ====================== Filtre et tri ====================== */
  .rangee-filtres { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--space-3); }
  .filtre { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-pilule);
    padding: 6px 12px; border: 1px solid var(--filet); background: var(--blanc); cursor: pointer;
    font: 400 12px/16px var(--font-sans); font-family: var(--font-sans); color: var(--texte);
    transition: background-color .18s ease, border-color .18s ease; }
  .filtre b { font-weight: 600; }
  .filtre[disabled] { opacity: .45; cursor: default; }
  .filtre:hover { border-color: var(--filet-aqua); }
  .filtre[aria-pressed="true"] { border-color: var(--aqua); font-weight: 600; }
  .rangee-tri { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-3); }
  .rangee-tri label.libelle { margin: 0; flex: none; }
  .champ-tri { height: 40px; min-width: 0; font: 400 14px/40px var(--font-sans); padding: 0 10px; }

  /* ====================== Cartes de la liste ====================== */
  /* flex: none — sinon les cartes s'écrasent quand la colonne est trop courte. */
  .carte-prospect { flex: none; position: relative; background: var(--blanc); border: 1px solid var(--filet);
    border-radius: var(--radius-carte); padding: var(--space-4) var(--space-4) var(--space-4) 20px;
    text-align: left; cursor: pointer; width: 100%; font-family: var(--font-sans); overflow: hidden;
    transition: background-color .18s ease, border-color .18s ease, box-shadow .18s ease; }
  .carte-prospect::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--rail); }
  .carte-prospect:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
  .carte-prospect .entete { display: flex; align-items: center; gap: 10px; }
  .carte-prospect .pastille-init { width: 36px; height: 36px; border-radius: var(--radius-pilule); flex: none;
    display: flex; align-items: center; justify-content: center; font: 600 13px/13px var(--font-sans); color: #fff; }
  .carte-prospect .nom { font: 600 16px/21px var(--font-sans); color: var(--encre); }
  .carte-prospect .meta { font: 400 13px/18px var(--font-sans); color: var(--gris); margin-top: 1px; }
  /* Le statut porte sa pastille, blanche sur la teinte de la carte. */
  .carte-prospect .statut { display: inline-flex; align-items: center; border-radius: var(--radius-pilule);
    padding: 4px 11px; background: var(--blanc); border: 1px solid var(--filet);
    font: 600 12px/16px var(--font-sans); color: var(--texte); }

  /* Rampe « terrain » de la charte : du statut le plus frais au plus travaillé.
     La carte prend le fond, la pastille et le filtre prennent le texte. */
  .carte-prospect.teinte-1 { background: var(--terrain-1-fond); border-color: var(--terrain-1-filet); }
  .carte-prospect.teinte-1 .statut { color: var(--terrain-1-texte); border-color: var(--terrain-1-filet); }
  .filtre.teinte-1 { background: var(--terrain-1-fond); border-color: var(--terrain-1-filet); color: var(--terrain-1-texte); }
  .filtre.teinte-1[aria-pressed="true"] { border-color: var(--terrain-1-texte); }
  .carte-prospect.teinte-2 { background: var(--terrain-2-fond); border-color: var(--terrain-2-filet); }
  .carte-prospect.teinte-2 .statut { color: var(--terrain-2-texte); border-color: var(--terrain-2-filet); }
  .filtre.teinte-2 { background: var(--terrain-2-fond); border-color: var(--terrain-2-filet); color: var(--terrain-2-texte); }
  .filtre.teinte-2[aria-pressed="true"] { border-color: var(--terrain-2-texte); }
  .carte-prospect.teinte-3 { background: var(--terrain-3-fond); border-color: var(--terrain-3-filet); }
  .carte-prospect.teinte-3 .statut { color: var(--terrain-3-texte); border-color: var(--terrain-3-filet); }
  .filtre.teinte-3 { background: var(--terrain-3-fond); border-color: var(--terrain-3-filet); color: var(--terrain-3-texte); }
  .filtre.teinte-3[aria-pressed="true"] { border-color: var(--terrain-3-texte); }
  .carte-prospect.teinte-4 { background: var(--terrain-4-fond); border-color: var(--terrain-4-filet); }
  .carte-prospect.teinte-4 .statut { color: var(--terrain-4-texte); border-color: var(--terrain-4-filet); }
  .filtre.teinte-4 { background: var(--terrain-4-fond); border-color: var(--terrain-4-filet); color: var(--terrain-4-texte); }
  .filtre.teinte-4[aria-pressed="true"] { border-color: var(--terrain-4-texte); }
  .carte-prospect.teinte-5 { background: var(--terrain-5-fond); border-color: var(--terrain-5-filet); }
  .carte-prospect.teinte-5 .statut { color: var(--terrain-5-texte); border-color: var(--terrain-5-filet); }
  .filtre.teinte-5 { background: var(--terrain-5-fond); border-color: var(--terrain-5-filet); color: var(--terrain-5-texte); }
  .filtre.teinte-5[aria-pressed="true"] { border-color: var(--terrain-5-texte); }

  /* Le fond est déjà pris par la teinte du statut : survol et sélection se
     marquent au filet et à l'ombre, sans l'effacer. */
  .carte-prospect:hover { border-color: var(--filet-aqua); box-shadow: var(--ombre-carte); }
  .carte-prospect[aria-current="true"] { border-color: var(--aqua); box-shadow: var(--ombre-carte); }
  .carte-prospect[aria-current="true"] .nom { color: var(--aqua-texte); }

  .carte-prospect.urgence-neuf::before { background: var(--rose); }
  .carte-prospect.urgence-retard::before { background: var(--rose); }
  .carte-prospect.urgence-rappeler::before { background: var(--rose); }
  .carte-prospect.urgence-jamais::before { background: var(--aqua); }
  .carte-prospect.urgence-avenir::before { background: var(--violet); }
  .carte-prospect.urgence-relance::before { background: var(--gris-doux); }

  /* ====================== Cartes de la fiche ====================== */
  .carte { background: var(--blanc); border: 1px solid var(--filet); border-radius: var(--radius-carte); padding: var(--space-5); }
  .carte + .carte { margin-top: var(--space-4); }

  /* Le bloc d'identité insiste : c'est qui on appelle, et à quel numéro. */
  .carte-identite { background: var(--degrade-profond); border: none; border-radius: var(--radius-encadre);
    padding: var(--space-6); color: #fff; box-shadow: var(--ombre-flottante); }
  .carte-identite h1 { font: 300 34px/40px var(--font-sans); letter-spacing: -.015em; margin: 0 0 var(--space-4); color: #fff; }
  .carte-identite h1 b { font-weight: 600; }
  .bouton-appel { display: inline-flex; align-items: center; gap: 12px; background: #fff; color: var(--profond-haut);
    border-radius: var(--radius-pilule); padding: 16px 28px; text-decoration: none;
    font: 600 24px/24px var(--font-sans); letter-spacing: -.01em; box-shadow: var(--ombre-profonde);
    transition: background-color .18s ease; }
  .bouton-appel:hover { background: var(--wash-2); }
  .bouton-appel svg { width: 20px; height: 20px; flex: none; }
  .infos-profond { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--space-4);
    margin-top: var(--space-6); padding-top: var(--space-5); border-top: 1px solid rgba(255,255,255,.2); }
  .infos-profond dt { font: 600 10.5px/14px var(--font-sans); letter-spacing: .12em; text-transform: uppercase;
    color: var(--aqua-clair); margin-bottom: 3px; }
  .infos-profond dd { margin: 0; font: 400 15px/21px var(--font-sans); color: var(--profond-texte); }
  .note-bureau { margin-top: var(--space-5); background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.2);
    border-radius: var(--radius-champ); padding: var(--space-4); }

  /* ====================== Étiquettes ====================== */
  .etiquette { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-pilule);
    padding: 5px 12px; font: 600 12px/16px var(--font-sans); }
  .et-factuelle { background: var(--terrain-2-fond); color: var(--terrain-2-texte); }
  .et-mesure { background: var(--wash-2); color: var(--aqua-texte); }
  .et-chaude { background: var(--rose-wash); color: var(--rose-texte); }
  .et-douce { background: var(--violet-wash); color: var(--violet-texte); }
  .et-profond { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.2); color: #fff; }
  /* Le statut est la première chose à lire : c'est la seule pastille pleine. */
  .et-statut { background: #fff; color: var(--profond-haut); }
  .rangee-etiquettes { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .point { width: 7px; height: 7px; border-radius: var(--radius-pilule); flex: none; }

  /* ====================== Boutons ====================== */
  .bouton-primaire { font: 600 16px/16px var(--font-sans); background: var(--rose); color: #fff; border: none;
    border-radius: var(--radius-pilule); padding: 18px 36px; cursor: pointer; box-shadow: var(--ombre-cta);
    transition: background-color .18s ease; }
  .bouton-primaire:hover:not(:disabled) { background: var(--rose-texte); }
  .bouton-primaire:disabled { background: var(--terrain-2-fond); color: var(--gris-doux); box-shadow: none; cursor: not-allowed; }
  .bouton-tertiaire { font: 400 14px/14px var(--font-sans); background: none; border: none; color: var(--texte);
    cursor: pointer; padding: 8px; font-family: var(--font-sans); }
  .bouton-tertiaire:hover { text-decoration: underline; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--aqua); outline-offset: 2px; }
  header.barre button:focus-visible, header.barre input:focus-visible { outline-color: var(--aqua-clair); }

  /* Choix unique : les trois états de la carte d'option, sans ombre ni déplacement */
  .choix { display: inline-flex; align-items: center; gap: 10px; min-height: 60px; padding: 16px 24px;
    background: var(--blanc); border: 1px solid var(--filet); border-radius: var(--radius-carte);
    font: 600 16px/16px var(--font-sans); color: var(--encre); cursor: pointer;
    transition: background-color .18s ease, border-color .18s ease; }
  .choix:hover { background: var(--wash-2); border-color: var(--filet-aqua); }
  .choix[aria-pressed="true"] { background: var(--wash-2); border-color: var(--aqua); }
  .choix .rond { width: 20px; height: 20px; border-radius: var(--radius-pilule); flex: none;
    border: 1px solid var(--filet-aqua); background: var(--blanc); }
  .choix[aria-pressed="true"] .rond { border-color: var(--aqua); background: var(--aqua); }
  /* La relance tant que le second appel n'est pas passé : visible, pour qu'on
     sache qu'elle existe, mais hors d'atteinte. */
  .choix[disabled] { opacity: .4; cursor: default; }
  .choix[disabled]:hover { background: var(--blanc); border-color: var(--filet); }

  /* Case à cocher : même famille que les cartes d'option, en plus compact. */
  .case { display: inline-flex; align-items: center; gap: 12px; width: 100%; min-height: 56px;
    padding: 12px 18px; background: var(--blanc); border: 1px solid var(--filet);
    border-radius: var(--radius-champ); font: 400 15px/21px var(--font-sans); color: var(--encre);
    cursor: pointer; text-align: left;
    transition: background-color .18s ease, border-color .18s ease; }
  .case:hover { background: var(--wash-2); border-color: var(--filet-aqua); }
  .case[aria-pressed="true"] { background: var(--wash-2); border-color: var(--aqua); font-weight: 600; }
  .case .carre { width: 22px; height: 22px; border-radius: var(--radius-puce); flex: none;
    border: 1px solid var(--filet-aqua); background: var(--blanc);
    display: flex; align-items: center; justify-content: center; }
  .case[aria-pressed="true"] .carre { border-color: var(--aqua); background: var(--aqua); }
  .case .carre svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
  .case[aria-pressed="true"] .carre svg { opacity: 1; }

  /* Suite de l'appel : la même carte d'option, mais titre et explication empilés */
  .choix-bloc { flex-direction: column; align-items: flex-start; gap: 8px; width: 100%;
    text-align: left; padding: var(--space-4); }
  .choix-bloc .rond { width: 18px; height: 18px; }
  .choix-bloc b { font: 600 16px/20px var(--font-sans); }
  .choix-bloc .sous { font: 400 13px/18px var(--font-sans); color: var(--gris); }

  /* ====================== Scripts du livret ====================== */
  .script { background: var(--wash); border: 1px solid var(--filet-aqua); border-radius: var(--radius-champ);
    padding: var(--space-4) var(--space-5); font: 400 15px/24px var(--font-sans); color: var(--encre);
    white-space: pre-wrap; }
  .script + .script { margin-top: var(--space-3); }
  .script b { font-weight: 600; color: var(--aqua-texte); }
  .script .didascalie { display: block; margin-top: var(--space-3); font: 600 13px/20px var(--font-sans);
    color: var(--aqua-texte); }
  .script-manquant { background: var(--terrain-2-fond); border-color: var(--terrain-2-filet); }

  /* Une carte entière repliée derrière sa barre : fermée, elle ne coûte qu'une
     ligne, et la fiche reste courte jusqu'aux informations de la personne. */
  details.pliant { background: var(--blanc); border: 1px solid var(--filet);
    border-radius: var(--radius-carte); }
  details.pliant + details.pliant, .carte + details.pliant, details.pliant + .carte { margin-top: var(--space-4); }
  details.pliant > summary { list-style: none; cursor: pointer; padding: var(--space-5);
    display: flex; align-items: center; gap: 12px; }
  details.pliant > summary::-webkit-details-marker { display: none; }
  details.pliant > summary::before { content: ''; width: 9px; height: 9px; flex: none;
    border-right: 2px solid var(--aqua); border-bottom: 2px solid var(--aqua);
    transform: rotate(-45deg); transition: transform .18s ease; }
  details.pliant[open] > summary::before { transform: rotate(45deg); }
  details.pliant > summary:hover { background: var(--wash-2); border-radius: var(--radius-carte); }
  details.pliant > summary .intitule { font: 600 16px/22px var(--font-sans); color: var(--encre); }
  details.pliant > summary .indice { margin-left: auto; font: 400 13px/18px var(--font-sans); color: var(--gris); }
  details.pliant .dedans-carte { padding: 0 var(--space-5) var(--space-5); }

  details.section { border: 1px solid var(--filet); border-radius: var(--radius-champ); background: var(--blanc); }
  details.section + details.section { margin-top: var(--space-2); }
  details.section > summary { list-style: none; cursor: pointer; padding: 14px var(--space-4);
    font: 600 15px/21px var(--font-sans); color: var(--encre); display: flex; align-items: center; gap: 10px; }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary::before { content: ''; width: 8px; height: 8px; flex: none;
    border-right: 2px solid var(--aqua); border-bottom: 2px solid var(--aqua);
    transform: rotate(-45deg); transition: transform .18s ease; }
  details.section[open] > summary::before { transform: rotate(45deg); }
  details.section > summary:hover { background: var(--wash-2); border-radius: var(--radius-champ); }
  details.section .dedans { padding: 0 var(--space-4) var(--space-4); }
  .liste-puces { margin: 0; padding-left: 20px; font: 400 15px/26px var(--font-sans); color: var(--encre); }
  .alerte { border-left: 3px solid var(--rose); background: var(--rose-wash); border-radius: var(--radius-puce);
    padding: var(--space-3) var(--space-4); font: 400 14px/22px var(--font-sans); color: var(--encre); }
  .essais { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-bottom: var(--space-4); }
  .essai { display: inline-flex; align-items: center; gap: 10px; border-radius: var(--radius-pilule);
    padding: 10px 18px; border: 1px solid var(--filet); background: var(--blanc); cursor: pointer;
    font: 400 14px/20px var(--font-sans); font-family: var(--font-sans); color: var(--texte);
    transition: background-color .18s ease, border-color .18s ease; }
  .essai:hover { border-color: var(--filet-aqua); }
  .essai[aria-pressed="true"] { background: var(--wash-2); border-color: var(--aqua); color: var(--encre); font-weight: 600; }
  .essai .heure { color: var(--aqua-texte); font-weight: 600; }
  /* Un essai déjà en base garde son air de fait accompli : il ne se survole
     plus et ne se décoche plus, mais il n'a pas à paraître indisponible. */
  .essai[disabled] { cursor: default; }
  .essai[disabled]:hover { border-color: var(--aqua); }

  /* ====================== Champs ====================== */
  label.libelle { display: block; font: 400 14px/22px var(--font-sans); color: var(--texte); margin-bottom: 6px; }
  .champ { width: 100%; height: 52px; border: 1px solid var(--filet); border-radius: var(--radius-champ);
    padding: 0 16px; font: 400 16px/52px var(--font-sans); color: var(--encre); background: var(--blanc);
    transition: border-color .18s ease; }
  textarea.champ { height: auto; min-height: 130px; padding: 14px 16px; line-height: 24px; resize: vertical; }
  .champ:focus { border-color: var(--aqua); }
  .champ-erreur { border-color: var(--erreur); }
  select.champ { appearance: none; -webkit-appearance: none; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23585856' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat; background-position: right 16px center; background-size: 12px 8px;
    padding-right: 40px; }

  /* ====================== Détails ====================== */
  .surtitre-carte { font: 600 10.5px/14px var(--font-sans); letter-spacing: .12em; text-transform: uppercase;
    color: var(--aqua-texte); margin: 0 0 var(--space-4); }
  .paire { display: grid; grid-template-columns: 170px 1fr; gap: var(--space-3); padding: 12px 0; }
  .paire + .paire { border-top: 1px solid var(--filet); }
  .paire dt { font: 400 14px/22px var(--font-sans); color: var(--gris); }
  .paire dd { margin: 0; font: 400 15px/22px var(--font-sans); color: var(--encre); }
  .grille-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  .grille-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: var(--space-3); }

  .cycle { padding: var(--space-4); border: 1px solid var(--filet); border-radius: var(--radius-champ); background: var(--wash); }
  .cycle + .cycle { margin-top: var(--space-3); }
  /* Corriger une note est discret : un lien sous le texte, pas un bouton qui
     attire l'œil au milieu de l'historique. */
  .lien-note { display: inline-block; margin-top: var(--space-3); padding: 0; border: none;
    background: none; cursor: pointer; font: 500 13px/18px var(--font-sans);
    color: var(--aqua-texte); text-decoration: underline; text-underline-offset: 3px; }
  .lien-note:hover { color: var(--encre); }
  .bouton-note { flex: none; cursor: pointer; background: var(--aqua); border: 1px solid var(--aqua);
    border-radius: var(--radius-pilule); padding: 9px 18px;
    font: 600 14px/14px var(--font-sans); color: #fff; }
  .bouton-note:hover { filter: brightness(1.05); }
  .bouton-note[disabled] { opacity: .6; cursor: default; }
  .cycle-numero { width: 24px; height: 24px; border-radius: var(--radius-pilule); flex: none; background: var(--aqua);
    color: #fff; font: 600 12px/24px var(--font-sans); text-align: center; }

  .vide { text-align: center; padding: var(--space-9) var(--space-5); }

  /* Barre d'enregistrement : toujours sous la main, jamais à chercher. */
  .barre-action { position: fixed; left: 400px; right: 0; bottom: 0; z-index: 40;
    background: rgba(255,255,255,.96); border-top: 1px solid var(--filet); box-shadow: var(--ombre-flottante);
    padding: var(--space-4) var(--space-6); display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap;
    backdrop-filter: blur(8px); }

  /* ===================== Documents ===================== */
  /* Les documents du bureau passent par-dessus l'espace : la thérapeute les
     consulte sans perdre sa fiche, et un clic sur le voile la lui rend. */
  .voile { position: fixed; inset: 0; z-index: 70; background: rgba(13, 61, 69, .55);
    display: flex; justify-content: center; padding: var(--space-6) var(--space-5);
    overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .carte-doc { width: 100%; max-width: 980px; margin: auto; background: var(--blanc);
    border: 1px solid var(--filet); border-radius: var(--radius-encadre);
    box-shadow: var(--ombre-flottante); padding: var(--space-6); }
  .doc-entete { display: flex; align-items: flex-start; gap: var(--space-4); margin-bottom: var(--space-5); }
  .doc-entete > div:first-child { flex: 1; min-width: 0; }
  .doc-actions { flex: none; display: flex; gap: var(--space-2); }
  /* Le choix du document : les pastilles des filtres de la liste, en un peu
     plus lisible, parce qu'on les lit de loin et rarement. */
  .doc-onglets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--space-4); }
  .onglet-doc { padding: 8px 14px; font-size: 13px; line-height: 18px; }
  .lien-fermer { text-decoration: none; display: inline-block; }
  /* Une page A4 tient dans ce rapport : la thérapeute lit sans redimensionner. */
  /* Les pages du document, et rien d'autre : ni barre d'outils, ni miniatures. */
  .doc-pages { max-height: 74vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--wash); border: 1px solid var(--filet); border-radius: var(--radius-champ);
    padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
  .doc-page { display: block; width: 100%; height: auto; border-radius: var(--radius-puce);
    box-shadow: var(--ombre-carte); background: var(--blanc); }
  .doc-grand-lien { display: block; text-decoration: none; padding: var(--space-5);
    background: var(--wash); border: 1px solid var(--filet-aqua); border-radius: var(--radius-champ); }
  .doc-grand-lien b { display: block; font: 600 17px/24px var(--font-sans); color: var(--aqua-texte); }
  .doc-grand-lien span { display: block; margin-top: 4px; font: 400 14px/20px var(--font-sans); color: var(--gris); }
  .doc-grand-lien:hover { border-color: var(--aqua); background: var(--wash-2); }
  .lien-fermer { flex: none; cursor: pointer; background: var(--wash-2); border: 1px solid var(--filet);
    border-radius: var(--radius-pilule); padding: 9px 18px;
    font: 500 14px/14px var(--font-sans); color: var(--gris); }
  .lien-fermer:hover { color: var(--encre); border-color: var(--gris-doux); }
  @media (max-width: 700px) {
    .voile { padding: var(--space-4) var(--space-3); }
    .carte-doc { padding: var(--space-5) var(--space-4); }
    .doc-pages { max-height: 66vh; padding: var(--space-3); gap: var(--space-3); }
    /* Les deux boutons prenaient toute la largeur et étranglaient le titre. */
    .doc-entete { flex-direction: column; gap: var(--space-3); }
    .doc-actions { width: 100%; }
    .doc-actions > * { flex: 1; text-align: center; }
    /* Sur un téléphone, la colonne de gauche étrangle le texte : on empile. */
    .paire { grid-template-columns: 1fr; gap: 4px; padding: 10px 0; }
    .paire dt { font-weight: 600; color: var(--encre); }
  }

  /* ====================== Message ====================== */
  #message { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); z-index: 60;
    border-radius: var(--radius-pilule); padding: 15px 28px; font: 600 15px/15px var(--font-sans);
    box-shadow: var(--ombre-flottante); }
  .msg-ok { background: var(--succes); color: #fff; }
  .msg-ko { background: var(--erreur); color: #fff; }

  @media (max-width: 1100px) {
    main.espace-corps { grid-template-columns: 1fr; }
    /* L'en-tête (recherche, compteurs, filtre, tri) prend déjà de la hauteur :
       la colonne en garde assez pour montrer plusieurs cartes. */
    .colonne-liste { border-right: none; border-bottom: 1px solid var(--filet); max-height: 62vh; }
    .liste-entete { padding: var(--space-4) var(--space-4) var(--space-3); }
    .compteur { padding: 8px 10px; }
    .compteur b { font-size: 18px; line-height: 22px; }

     puis les fiches d'information destinées au médecin d'une cliente. L'onglet
     choisi décide de l'en-tête, du lien « Ouvrir à part » et des pages. -->

<div id="message" class="cache" role="status"></div>

<script>
/* ============================================================================
 * Espace thérapeutes — tout passe par /.netlify/functions/therapeutes-api.
 * Le navigateur ne connaît aucun token Airtable : il n'a que le code du centre,
 * et c'est le serveur qui décide de ce qu'il a le droit de lire et d'écrire.
 * ========================================================================== */

var CLE_CODE = 'mabeautyplus_therapeutes_code';

var CLE_PRENOM = 'mabeautyplus_therapeutes_prenom';

// Qui travaille dans quel centre. Cette liste remplace la saisie libre du prénom :
// « caroll » et « Caroll » feraient deux personnes différentes dans le suivi du bureau.
// À tenir à jour quand une thérapeute arrive ou s'en va.
var THERAPEUTES = {
  'Pollestres': ['Anna', 'Marine', 'Sara'],
  'Sérignan': ['Caroll', 'Marie-san'],
  'Le Crès': ['Alex', 'Malvina'],
  'Avignon': ['Alexandra', 'Laura'],
  'Le Grau-du-Roi': ['Marie', 'Nadia'],
};

// Le bureau vient tenir un centre quand une thérapeute est malade : ces prénoms
// sont proposés partout, sous l'équipe du centre, sans appartenir à aucune.
var RENFORT = ['Elisa', 'Flora'];
var VALEUR_AUTRE = '__autre';

// Avant la connexion on ne connaît pas encore le centre : on montre tout le monde,
// rangé par centre. Une fois connectée, elle ne voit plus que son équipe.
function remplirListeTherapeutes(select, centre, valeur) {
  if (!select) return;
  function option(nom) {
    return '<option value="' + echapper(nom) + '"' + (nom === valeur ? ' selected' : '') + '>' + echapper(nom) + '</option>';
  }
  var html = '<option value=""' + (valeur ? '' : ' selected') + '>Choisissez votre prénom</option>';
  var connues = [];
  if (centre && THERAPEUTES[centre]) {
    connues = THERAPEUTES[centre].slice();
    html += connues.map(option).join('');
  } else {
    Object.keys(THERAPEUTES).forEach(function (c) {
      html += '<optgroup label="' + echapper(c) + '">' + THERAPEUTES[c].map(option).join('') + '</optgroup>';
      connues = connues.concat(THERAPEUTES[c]);
    });
  }
  html += '<optgroup label="Renfort du bureau">' + RENFORT.map(option).join('') + '</optgroup>';
  connues = connues.concat(RENFORT);
  // Un prénom déjà enregistré qui ne figure pas dans la liste reste proposé,
  // sinon la thérapeute se verrait vidée de son identité sans comprendre pourquoi.
  if (valeur && connues.indexOf(valeur) < 0) html += option(valeur);
  html += '<option value="' + VALEUR_AUTRE + '">Autre…</option>';
  select.innerHTML = html;
}

// « Autre… » : on efface la liste et on laisse le champ libre, pour qu'une
// nouvelle thérapeute puisse travailler le jour même sans attendre une mise à jour.
function brancherChoixPrenom(select, input, apres) {
  if (!select || !input) return;
  select.onchange = function () {
    if (select.value === VALEUR_AUTRE) {
      select.classList.add('cache');
      input.classList.remove('cache');
      input.value = '';
      input.focus();
      return;
    }
    input.value = select.value;
    if (apres) apres(select.value);
  };
  input.oninput = function () { if (apres) apres(input.value); };
}

/* Les suites possibles après un appel, pour un prospect donné. La clé part telle
 * quelle au serveur, qui en déduit le statut : le navigateur n'en décide jamais.
 *
 * Le premier bouton suit l'échelle des relances et dépend du statut actuel :
 * R2, puis R3, puis Injoignable. Il se transforme donc tout seul d'un appel au
 * suivant, sans que la thérapeute ait à savoir où elle en est. */
function suitesPour(p) {
  var statut = p && p.statut;
  // `relance: true` désigne la carte qui fait monter d'un cran dans le process.
  // C'est la seule que le premier contact inachevé verrouille : les autres
  // restent ouvertes, parce qu'une cliente peut rappeler entre les deux essais.
  var relance = statut === 'R2'
    ? { cle: 'r3', titre: 'R3', relance: true,
        sous: 'Toujours pas de retour après R2',
        resume: 'Elle reste dans votre liste d\'appels.' }
    : statut === 'R3'
      ? { cle: 'injoignable', titre: 'Injoignable', relance: true,
          sous: 'Aucun retour après toutes les tentatives',
          resume: 'Envoyez le SMS de dernière relance. Elle sort de votre liste.' }
      : { cle: 'r2', titre: 'R2', relance: true,
          sous: 'Pas de retour après le premier contact',
          resume: 'Elle reste dans votre liste d\'appels.' };

  return [
    relance,
    { cle: 'arappeler', titre: 'À rappeler',
      sous: 'Elle a répondu et veut qu\'on la rappelle, sans heure précise',
      resume: 'Elle reste dans votre liste, à rappeler dès que possible, sans date.' },
    { cle: 'perdu', titre: 'Perdu',
      sous: 'Elle ne veut pas avancer : ni bilan, ni relance à prévoir',
      resume: 'Elle passe en « Perdu » et sort de votre liste d\'appels.' },
    { cle: 'bilan', titre: 'Bilan placé',
      sous: 'Un bilan d\'une heure est réservé',
      libelleDate: 'Bilan au centre le',
      resume: 'Elle sort de votre liste d\'appels.' },
  ];
}

/** La suite choisie, retrouvée dans les options du prospect affiché. */
function suiteChoisie() {
  if (!etat.suite) return null;
  return suitesPour(etat.selection).find(function (x) { return x.cle === etat.suite; }) || null;
}

/* ==========================================================================
 * Les textes du livret de formation commerciale (octobre 2026).
 * Recopiés mot pour mot : le livret dit « les scripts sont communs à tous les
 * centres : on ne les réécrit pas ». Les crochets sont remplis à l'affichage.
 * ========================================================================== */

/* L'étape du process où se trouve le prospect, d'après son statut. C'est elle
 * qui décide du message à laisser quand personne ne décroche. Un statut absent
 * d'ici n'a pas de message figé par le livret. */
var ETAPE_DU_STATUT = {
  'Nouveau': 'contact',
  'Réinscrit': 'contact',
  'R2': 'r2',
  'R3': 'r3',
  'Bilan annulé': 'reprise',
};

var MESSAGES = {
  contact: {
    titre: 'La note vocale',
    sous: 'Étape 1 · après les deux appels, si personne n\'a décroché',
    champ: 'messageContact',
    case: 'Note vocale enregistrée et envoyée',
    texte: 'Bonjour [Prénom], c\'est [Votre prénom] de MAbeautyplus. Je vous contacte suite à votre demande concernant votre objectif de perte de poids et de bien-être. L\'idée est simplement de prendre quelques minutes avec vous pour comprendre votre situation et voir ce qui pourrait réellement vous aider à avancer. Je vous laisse me rappeler dès que vous êtes disponible, ou répondre par SMS. À très bientôt.',
  },
  r2: {
    titre: 'Le SMS de relance R2',
    sous: 'Étape 2 · après l\'appel sans réponse',
    champ: 'messageR2',
    case: 'SMS R2 envoyé',
    texte: 'Bonjour [Prénom], suite à votre demande concernant votre objectif de perte de poids et de bien-être, nous avons tenté de vous joindre sans succès. La première étape chez MAbeautyplus est un échange avec une experte afin de mieux comprendre votre situation, vos besoins et vos objectifs, et de pouvoir vous orienter au mieux. Quand seriez-vous disponible pour que nous puissions vous rappeler tranquillement ? Au plaisir d\'échanger avec vous, L\'équipe MAbeautyplus',
  },
  r3: {
    titre: 'Le SMS responsabilisant R3',
    sous: 'Étape 3 · une seule action demandée : qu\'elle réponde avec ses disponibilités',
    champ: 'messageR3',
    case: 'SMS R3 envoyé',
    texte: 'Bonjour [Prénom], vous nous avez contactés pour avancer sur votre objectif de perte de poids et de bien-être, mais nous n\'avons pas encore réussi à échanger avec vous. Si cet objectif est toujours important pour vous, c\'est le bon moment pour faire le premier pas : répondez simplement à ce SMS avec vos disponibilités afin qu\'une experte MAbeautyplus puisse vous rappeler. On s\'occupe de la suite avec vous. L\'équipe MAbeautyplus',
  },
  reprise: {
    titre: 'Le SMS de reprise de contact',
    sous: 'Étape 4 · son bilan a été annulé, on reprogramme sans reproche',
    champ: null,
    texte: null,
    consigne: 'Le livret ne fige pas ce texte. Commencez par son prénom et proposez de fixer un nouveau créneau, sans lui faire de reproche.',
  },
  // Étape 5 du livret. Pas encore affichée : une fiche passée en « Injoignable »
  // quitte la liste du centre, et à R3 le SMS à envoyer est celui de R3 — en
  // montrer deux dans le même appel reviendrait à multiplier les relances, ce
  // que le livret interdit. Le texte attend qu'on décide qui envoie ce dernier
  // SMS : le bureau, ou le centre si on lui ouvre le statut « Injoignable ».
  injoignable: {
    titre: 'Le SMS de dernière relance',
    sous: 'Étape 5 · le dernier message avant la clôture',
    champ: null,
    texte: 'Bonjour [Prénom], malgré plusieurs tentatives, nous n\'avons pas encore réussi à échanger avec vous concernant votre objectif de perte de poids et de bien-être. Si cet objectif reste une priorité pour vous, répondez simplement à ce SMS afin qu\'une experte MAbeautyplus puisse vous recontacter. À défaut de retour, nous clôturerons votre demande. L\'équipe MAbeautyplus',
  },
};

/* Les documents que le bureau met à la main des thérapeutes : son livret de
 * formation commerciale, puis une fiche d'information par appareil, destinée
 * au médecin d'une cliente qui doit écarter une contre-indication avant que
 * le protocole commence.
 *
 * Tous sont servis tels quels, en PDF : une seule version circule, celle du
 * bureau — celle que les thérapeutes ont aussi sur papier. Une nouvelle
 * version se répercute en remplaçant le fichier dans assets/, rien d'autre.
 *
 * On ne les confie pas au lecteur PDF du navigateur : il arrive avec sa barre
 * d'outils, son volet de miniatures et son gris d'atelier, qui n'ont rien à
 * faire au milieu d'un espace de travail. (Les paramètres `#toolbar=0` et
 * `#navpanes=0` ne servent plus à rien : Chrome les ignore, et le cadre reste
 * blanc.) On dessine donc les pages nous-mêmes avec pdf.js, et on n'affiche
 * que les pages.
 *
 * Chaque page est rendue une fois, puis gardée en image pour la session : le
 * navigateur décide seul de ce qu'il garde décodé, là où vingt-deux toiles
 * ouvertes coûteraient des centaines de méga-octets.
 *
 * Si pdf.js ne se charge pas — CDN coupé, réseau du centre qui filtre — on
 * retombe sur le lien qui ouvre le document dans le lecteur du système. */
var DOCUMENTS = [
  {
    cle: 'process',
    onglet: 'Process commercial',
    surtitre: 'Formation commerciale · thérapeutes',
    titre: 'Le process <b>commercial</b>',
    phrase: 'Le livret du bureau, en entier.',
    fichier: 'assets/livret-commercial-therapeutes.pdf',
    ouvrir: 'Ouvrir le livret',
    pages: '22 pages',
  },
  {
    cle: 'pressodynamie',
    onglet: 'Pressodynamie',
    surtitre: 'Fiche d\'information · médecin',
    titre: 'Pressodynamie <b>Starvac</b>',

var PDFJS_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
var PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var DOC_LARGEUR_MAX = 1600;   // pixels de la toile : au-delà, on ne gagne rien à l'œil
var etatsDocs = {};           // par document : ses pages dessinées, et où en est le dessin
var pdfJsEnRoute = null;      // le chargement de pdf.js, partagé par tous les documents
var docCourant = DOCUMENTS[0].cle;

/* Chaque statut a sa teinte, prise dans la rampe « terrain » de la charte :
 * de la fiche la plus fraîche (1) à la plus travaillée (5). Un statut absent
 * d'ici reste sur carte blanche — c'est voulu, la rampe ne s'invente pas. */
var TEINTES_STATUT = {
  'Nouveau': 1,
  'Réinscrit': 1,      // le livret dit de refaire la procédure comme pour un nouveau
  'Bilan annulé': 2,
  'À rappeler': 3,
  'R2': 4,
  'R3': 5,
};

/* Les statuts de la pile d'appels, dans l'ordre du process. La rangée de
 * filtres les montre tous, même à zéro : la thérapeute voit d'un coup d'œil
 * qu'il ne lui reste aucun nouveau, au lieu de voir la rangée changer de forme
 * d'un chargement à l'autre. Jumelle de STATUTS_A_APPELER côté serveur, qui
 * seul décide de ce qui arrive ici.
 * « Potentiel » a été retiré le 6 nov. 2026, remplacé par le bouton « Perdu »
 * qui sort la fiche de la pile. « À rappeler » a repris sa teinte le même jour :
 * elle se place entre le bilan annulé et la première relance. */
var STATUTS_LISTE = ['Nouveau', 'Réinscrit', 'Bilan annulé', 'À rappeler', 'R2', 'R3'];

/* Le statut du prospect qui a répondu et demande qu'on le rappelle, sans heure
 * convenue. Il n'ouvre aucun champ de date : « à rappeler », et c'est tout. */
var STATUT_A_RAPPELER = 'À rappeler';

/* Un lead frais se gagne dans l'heure : tant que personne ne l'a appelé, il
 * passe devant tout le reste. Le livret traite un réinscrit comme un nouveau. */
var STATUTS_NEUFS = ['Nouveau', 'Réinscrit'];

function teinteStatut(statut) {
  return TEINTES_STATUT[statut] || 0;
}

/* Les trois façons de classer la liste. « urgence » est celle d'origine. */
var TRIS = [
  ['urgence', 'Les plus urgentes'],
  ['anciennete', 'Les plus anciennes'],
  ['nom', 'Par prénom'],
];

var etat = {
  code: null,
  prenom: '',
  centre: null,
  prospects: [],
  selection: null,
  recherche: '',
  statut: '',         // '' = tous les statuts
  tri: 'urgence',
  resultat: null,     // true = a répondu, false = pas de réponse, null = pas encore choisi
  suite: null,        // clé d'une des SUITES, ou null : on enregistre l'appel sans rien changer
  suiteAuto: false,   // la carte a été cochée par l'appli, pas par la thérapeute
  suiteDate: '',
  messageEtape: false,    // le message de l'étape a été laissé
  essai1: null,           // heure du 1er essai du premier contact
  essai2: null,           // heure du 2e essai, 5 minutes plus tard
  noteEnEdition: null,    // le cycle dont on est en train de corriger la note
  habiteProximite: false,
  venueHebdo: false,
  antecedents: '',

  envoiEnCours: false,
};

/* ---------------------------------------------------------------- Utilitaires */

function echapper(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function formatTel(tel) {
  var c = String(tel || '').replace(/[^0-9+]/g, '');
  if (c.indexOf('+33') === 0) c = '0' + c.slice(3);
  if (c.length === 10) return c.replace(/(\d{2})(?=\d)/g, '$1 ').trim();
  return tel || '';
}

function formatDate(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
}

function formatDateHeure(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' à ' +
         d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function depuis(iso) {
  if (!iso) return '';
  var jours = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (isNaN(jours)) return '';
  if (jours <= 0) return "aujourd'hui";
  if (jours === 1) return 'hier';
  if (jours < 31) return 'il y a ' + jours + ' jours';
  var mois = Math.floor(jours / 30);
  return 'il y a ' + mois + ' mois';
}

/* « depuis 6 jours » — l'ancienneté d'un état, là où depuis() dit celle d'un
 * événement passé (« il y a 6 jours »). */
function formatHeure(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function depuisQuand(iso) {
  if (!iso) return '';
  var jours = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (isNaN(jours)) return '';
  if (jours <= 0) return "aujourd'hui";
  if (jours === 1) return 'depuis hier';
  if (jours < 31) return 'depuis ' + jours + ' jours';
  var mois = Math.floor(jours / 30);
  return 'depuis ' + mois + ' mois';
}

function pourChampDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return '';
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function message(texte, type) {
  var el = document.getElementById('message');
  el.textContent = texte;
  el.className = type === 'erreur' ? 'msg-ko' : 'msg-ok';
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.add('cache'); }, 4000);
}

/* ---------------------------------------------------------------- API */

async function api(action, charge) {
  var corps = Object.assign({ action: action, code: etat.code, therapeute: etat.prenom }, charge || {});
  var res = await fetch('/.netlify/functions/therapeutes-api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(corps),
  });
  var data = null;
  try { data = await res.json(); } catch (e) { /* laissé à null */ }
  if (!res.ok) throw new Error((data && data.error) || 'Erreur ' + res.status);
  return data;
}

/* ---------------------------------------------------------------- Tri */

/* Le premier contact, c'est deux appels à cinq minutes d'écart. Tant que le
 * second manque et que personne n'a décroché, la fiche est encore au premier
 * contact : la thérapeute enregistre ce qu'elle a fait, s'occupe d'autre
 * chose, et revient le terminer. Rien n'a bougé entre-temps — ni le statut,
 * ni le message à laisser, qui ne se justifient qu'une fois les deux appels
 * passés. */
function premierContactIncomplet(p) {
  return !!(p && p.appel1 && !p.appel1Bis && !p.repondu1 && !p.appel2);
}

function prochainCycle(p) {
  if (!p.appel1) return 1;
  if (premierContactIncomplet(p)) return 1;   // il reste le second appel
  if (!p.appel2) return 2;
  return 3;
}

/* Vu de la saisie en cours : le second appel est-il encore à passer ? C'est
 * lui qui commande l'apparition du message et de la relance. Une cliente qui
 * a décroché clôt le premier contact à elle seule. */
function deuxiemeAppelManque() {
  var p = etat.selection;
  if (!p || prochainCycle(p) !== 1) return false;
  if (etat.resultat === true) return false;
  return !etat.essai2;
}

/* Le rang d'urgence, du plus pressé au moins pressé :
 *   0  nouveau ou réinscrit que personne n'a encore appelé
 *   1  rappel attendu : l'heure promise est passée, ou elle a demandé qu'on la
 *      rappelle sans donner d'heure — dans les deux cas, c'est pour maintenant
 *   2  jamais appelé alors que le statut dit le contraire (saisie du bureau)
 *   3  rappel promis à une heure encore à venir
 *   4  déjà appelé, rien de promis
 * Le second élément départage à l'intérieur d'un rang : la fiche la plus
 * ancienne d'abord, pour que personne ne reste au fond de la pile. */
function priorite(p) {
  var maintenant = Date.now();
  var creation = new Date(p.creation || 0).getTime();
  var rappel = p.prochainRappel ? new Date(p.prochainRappel).getTime() : NaN;
  // Un premier contact commencé et pas fini passe devant tout le reste : il
  // reste un appel à passer cinq minutes plus tard. Le plus récent d'abord —
  // la fiche qu'on vient d'enregistrer est celle qu'on revient terminer, et
  // elle doit être sous la main, pas au fond de la pile. La clé est négative
  // pour que ces fiches gardent la tête du rang 0, devant les jamais appelées.
  if (premierContactIncomplet(p)) return [0, -new Date(p.appel1).getTime()];
  if (!isNaN(rappel) && rappel > maintenant) return [3, rappel];
  if (STATUTS_NEUFS.indexOf(p.statut) >= 0 && !p.appel1) return [0, creation];
  if (!isNaN(rappel)) return [1, rappel];
  // Sans heure convenue, c'est l'ancienneté du statut qui départage : celle qui
  // attend son rappel depuis le plus longtemps passe devant.
  if (p.statut === STATUT_A_RAPPELER) return [1, new Date(depuisStatut(p) || 0).getTime()];
  if (!p.appel1) return [2, creation];
  return [4, creation];
}

/* Depuis quand la fiche porte son statut actuel. « Statut changé le » est
 * calculé par Airtable ; il reste vide tant que le statut n'a jamais bougé, et
 * c'est alors la création qui fait foi — une fiche née « Nouveau » porte bien
 * ce statut depuis sa création. */
function depuisStatut(p) {
  return (p && (p.statutDepuis || p.creation)) || null;
}

/* La pastille de la carte dit depuis quand la fiche dort dans son statut :
 * c'est ça qui montre qu'on est en train de l'oublier. Seule exception, le
 * rappel promis à une heure à venir : là, c'est l'heure qui compte. La
 * couleur, elle, continue de dire l'urgence. */
function etiquettePriorite(p) {
  var pr = priorite(p);
  if (premierContactIncomplet(p)) return { texte: 'Le 2e appel reste à passer', classe: 'et-chaude' };
  if (pr[0] === 3) return { texte: 'Rappel le ' + formatDateHeure(p.prochainRappel), classe: 'et-douce' };
  var texte = depuisQuand(depuisStatut(p));
  var classe = pr[0] <= 1 ? 'et-chaude' : pr[0] === 2 ? 'et-mesure' : 'et-factuelle';
  return { texte: texte || 'Statut jamais daté', classe: classe };
}

function prospectsAffiches() {
  var q = etat.recherche.trim().toLowerCase();
  var qTel = q.replace(/[\s.\-+]/g, '');
  var liste = etat.prospects.filter(function (p) {
    if (etat.statut && p.statut !== etat.statut) return false;
    if (!q) return true;
    var nom = ((p.prenom || '') + ' ' + (p.nom || '')).toLowerCase();
    var tel = String(p.telephone || '').replace(/[\s.\-+]/g, '');
    return nom.indexOf(q) >= 0 || (qTel && tel.indexOf(qTel) >= 0);
  });

  if (etat.tri === 'nom') {
    return liste.sort(function (a, b) {
      return String(a.prenom || a.nom || '').localeCompare(String(b.prenom || b.nom || ''), 'fr');
    });
  }
  if (etat.tri === 'anciennete') {
    return liste.sort(function (a, b) {
      return (new Date(a.creation || 0)) - (new Date(b.creation || 0));
    });
  }
  return liste.sort(function (a, b) {
    var pa = priorite(a), pb = priorite(b);
    return pa[0] !== pb[0] ? pa[0] - pb[0] : pa[1] - pb[1];
  });
}

/* ---------------------------------------------------------------- Liste */

function initiales(nom) {
  var mots = String(nom || '').trim().split(/\s+/).filter(Boolean);
  if (!mots.length) return '?';
  return (mots[0][0] + (mots.length > 1 ? mots[mots.length - 1][0] : '')).toUpperCase();
}

/* « neuf » et « retard » partagent le rose : les deux veulent dire « on appelle
 * maintenant ». La pastille de la carte dit laquelle des deux c'est. */
function couleurUrgence(u) {
  if (u === 'neuf' || u === 'retard' || u === 'rappeler') return '#e8318a';
  return u === 'jamais' ? '#3bbfbf' : u === 'avenir' ? '#8e6fc6' : '#9babab';
}

function rangUrgence(p) {
  var r = priorite(p)[0];
  // Même rang que le rappel en retard, mais pas le même mot : un rappel promis
  // pour une heure passée est un retard, « À rappeler » est une attente.
  if (r === 1 && p.statut === STATUT_A_RAPPELER) return 'rappeler';
  return r === 0 ? 'neuf' : r === 1 ? 'retard' : r === 2 ? 'jamais' : r === 3 ? 'avenir' : 'relance';
}

function faitAujourdhui(p) {
  var jour = new Date().toDateString();
  return [1, 2, 3].some(function (n) {
    var d = p['appel' + n];
    return d && new Date(d).toDateString() === jour;
  });
}

function dessinerCompteurs() {
  var tous = etat.prospects;
  var cases = [
    [tous.length, 'à appeler'],
    [tous.filter(function (p) { return rangUrgence(p) === 'retard'; }).length, 'en retard'],
    [tous.filter(faitAujourdhui).length, "faits aujourd'hui"],
  ];
  document.getElementById('compteurs').innerHTML = cases.map(function (c) {
    return '<div class="compteur"><b>' + c[0] + '</b><span>' + echapper(c[1]) + '</span></div>';
  }).join('');
}

/* Une pastille par statut de la pile, toujours dans l'ordre du process et
 * toujours toutes : à zéro, la pastille reste en place mais ne se clique pas.
 * Un statut inattendu — le bureau en aurait ajouté un — se glisse à la fin
 * plutôt que de passer inaperçu. */
function dessinerFiltres() {
  var rangee = document.getElementById('filtres');
  var parStatut = {};
  etat.prospects.forEach(function (p) {
    var st = p.statut || 'Sans statut';
    parStatut[st] = (parStatut[st] || 0) + 1;
  });

  if (etat.prospects.length === 0) {
    rangee.innerHTML = '';
    etat.statut = '';
    return;
  }

  var statuts = STATUTS_LISTE.slice();
  Object.keys(parStatut).forEach(function (st) {
    if (statuts.indexOf(st) < 0) statuts.push(st);
  });

  // Le statut filtré vient de se vider : on revient sur « Toutes » plutôt que
  // de laisser une liste vide sans que la thérapeute comprenne pourquoi.
  if (etat.statut && !parStatut[etat.statut]) etat.statut = '';

  rangee.innerHTML =
    '<button type="button" class="filtre" data-statut="" aria-pressed="' + (!etat.statut) + '">' +
      'Toutes <b>' + etat.prospects.length + '</b></button>' +
    statuts.map(function (st) {
      var n = parStatut[st] || 0;
      return '<button type="button" class="filtre teinte-' + teinteStatut(st) + '"' +
        ' data-statut="' + echapper(st) + '" aria-pressed="' + (etat.statut === st) + '"' +
        (n ? '' : ' disabled') + '>' +
        echapper(st) + ' <b>' + n + '</b></button>';
    }).join('');

  Array.prototype.forEach.call(rangee.querySelectorAll('.filtre'), function (b) {
    b.onclick = function () {
      etat.statut = b.getAttribute('data-statut');
      dessinerListe();
    };
  });
}

function dessinerTri() {
  var champ = document.getElementById('champ-tri');
  if (champ.options.length === 0) {
    champ.innerHTML = TRIS.map(function (t) {
      return '<option value="' + t[0] + '">' + echapper(t[1]) + '</option>';
    }).join('');
    champ.onchange = function () { etat.tri = champ.value; dessinerListe(); };
  }
  champ.value = etat.tri;
}

function dessinerListe() {
  var liste = prospectsAffiches();
  var conteneur = document.getElementById('liste');

  dessinerCompteurs();
  dessinerFiltres();
  dessinerTri();

  if (liste.length === 0) {
    conteneur.innerHTML = '<div class="vide"><p class="corps" style="margin:0;">' +
      (etat.recherche ? 'Personne ne correspond à cette recherche.'
        : etat.statut ? 'Aucune fiche en « ' + echapper(etat.statut) +' ».'
        : 'Rien à appeler pour le moment.') + '</p></div>';
    return;
  }

  conteneur.innerHTML = liste.map(function (p) {
    var et = etiquettePriorite(p);
    var u = rangUrgence(p);
    var nom = ((p.prenom || '') + ' ' + (p.nom || '')).trim() || 'Sans nom';
    return '<button class="carte-prospect urgence-' + u + ' teinte-' + teinteStatut(p.statut) + '"' +
      ' data-id="' + echapper(p.id) + '"' +
      (etat.selection && etat.selection.id === p.id ? ' aria-current="true"' : '') + '>' +
      '<div class="entete">' +
        '<span class="pastille-init" style="background:' + couleurUrgence(u) + ';">' + echapper(initiales(nom)) + '</span>' +
        '<span style="min-width:0;">' +
          '<span class="nom" style="display:block;">' + echapper(nom) + '</span>' +
          '<span class="meta" style="display:block;">' + echapper(formatTel(p.telephone) || 'Pas de numéro') +
            (p.soin ? ' · ' + echapper(p.soin) : '') + '</span>' +
        '</span>' +
      '</div>' +
      '<div class="rangee-etiquettes" style="margin-top:12px;">' +
        (p.statut ? '<span class="statut">' + echapper(p.statut) + '</span>' : '') +
        '<span class="etiquette ' + et.classe + '">' +
          '<span class="point" style="background:' + couleurUrgence(u) + ';"></span>' +
          echapper(et.texte) + '</span>' +
      '</div>' +
      '</button>';
  }).join('');

  Array.prototype.forEach.call(conteneur.querySelectorAll('.carte-prospect'), function (b) {
    b.onclick = function () { selectionner(b.dataset.id); };
  });
}

function selectionner(id) {
  var p = etat.prospects.find(function (x) { return x.id === id; });
  if (!p) return;
  etat.selection = p;
  etat.resultat = null;
  etat.suite = null;
  etat.suiteAuto = false;
  etat.suiteDate = '';
  etat.messageEtape = !!messageDejaLaisse(p);
  // Les essais déjà enregistrés reviennent avec la fiche : la thérapeute qui
  // revient terminer un premier contact voit l'heure de son premier appel.
  etat.essai1 = p.appel1 || null;
  etat.essai2 = p.appel1Bis || null;
  etat.noteEnEdition = null;
  etat.habiteProximite = !!p.habiteProximite;
  etat.venueHebdo = !!p.venueHebdo;
  etat.antecedents = p.antecedents || '';
  dessinerListe();
  dessinerFiche();
  document.querySelector('.colonne-fiche').scrollTop = 0;
}

/* ---------------------------------------------------------------- Fiche */

/* Remplit les crochets du livret avec ce que l'appli sait déjà. Ce qui reste
 * inconnu est laissé en clair, pour qu'elle voie qu'il y a un trou à combler. */
function remplir(texte, p) {
  var centre = etat.centre || 'votre centre';
  return echapper(texte)
    .replace(/\[Prénom\]/g, '<b>' + echapper(p.prenom || 'son prénom') + '</b>')
    .replace(/\[Nom de famille\]/g, '<b>' + echapper(p.nom || p.prenom || '') + '</b>')
    .replace(/\[Votre prénom\]/g, '<b>' + echapper(etat.prenom || 'votre prénom') + '</b>')
    .replace(/\[Nom du centre\]/g, '<b>' + echapper(centre) + '</b>')
    .replace(/\[Ville\]/g, '<b>' + echapper(centre) + '</b>');
}

/* ------------------------------------------------------------- Documents */

function docPar(cle) {
  for (var i = 0; i < DOCUMENTS.length; i++) {
    if (DOCUMENTS[i].cle === cle) return DOCUMENTS[i];
  }
  return DOCUMENTS[0];
}

/* Ce qu'on sait d'un document : les pages déjà dessinées — la liste reste
 * partielle tant que le dessin court — et où en est ce dessin. */
function etatDoc(doc) {
  if (!etatsDocs[doc.cle]) {
    etatsDocs[doc.cle] = { pages: [], total: 0, enCours: false, fini: false };
  }
  return etatsDocs[doc.cle];
}

/* Une seule promesse pour tout le monde : deux documents demandés coup sur
 * coup posaient deux balises <script>, pdf.js s'exécutait deux fois et les
 * documents déjà ouverts restaient suspendus sur un ouvrier remplacé. */
function chargerPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfJsEnRoute) return pdfJsEnRoute;
  pdfJsEnRoute = new Promise(function (ok, ko) {
    var balise = document.createElement('script');
    balise.src = PDFJS_SRC;
    balise.onload = function () {
      if (!window.pdfjsLib) return ko(new Error('pdf.js absent'));
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      ok(window.pdfjsLib);
    };
    balise.onerror = function () { ko(new Error('pdf.js injoignable')); };
    document.head.appendChild(balise);
  });
  // Un réseau qui a flanché ne doit pas condamner les ouvertures suivantes.
  pdfJsEnRoute.catch(function () { pdfJsEnRoute = null; });
  return pdfJsEnRoute;
}

/* Une page dessinée puis aplatie en image : la toile est relâchée aussitôt. */
function pageEnImage(page) {
  var base = page.getViewport({ scale: 1 });
  var echelle = Math.min(DOC_LARGEUR_MAX / base.width, 2.5);
  var vue = page.getViewport({ scale: echelle });
  var toile = document.createElement('canvas');
  toile.width = Math.round(vue.width);
  toile.height = Math.round(vue.height);
  return page.render({ canvasContext: toile.getContext('2d'), viewport: vue }).promise
    .then(function () {
      return new Promise(function (ok) {
        toile.toBlob(function (blob) {
          ok({ url: URL.createObjectURL(blob), ratio: vue.width / vue.height });
          toile.width = toile.height = 0;
        }, 'image/jpeg', 0.92);
      });
    });
}

function baliseImage(doc, page, numero, total) {
  var legende = total > 1 ? doc.onglet + ', page ' + numero + ' sur ' + total : doc.onglet;
  return '<img class="doc-page" src="' + echapper(page.url) + '" ' +
    'style="aspect-ratio:' + page.ratio.toFixed(4) + ';" ' +
    'alt="' + echapper(legende) + '">';
}

function lienDoc(doc, raison) {
  return '<a class="doc-grand-lien" href="' + echapper(doc.fichier) + '" target="_blank" rel="noopener">' +
    '<b>' + echapper(doc.ouvrir) + '</b>' +
    '<span>' + echapper(doc.pages) + ' · PDF · s\'ouvre dans votre lecteur</span></a>' +
    '<p class="petit" style="margin:var(--space-3) 0 0;">' + echapper(raison) + '</p>';
}

/* On n'ajoute que les pages qui manquent à l'écran : la thérapeute a pu
 * changer d'onglet puis revenir pendant qu'un document se dessinait. */
function completerAffichage(doc) {
  if (doc.cle !== docCourant) return;
  var zone = document.querySelector('#docs-corps .doc-pages');
  if (!zone) return;
  var suivi = etatDoc(doc);
  for (var i = zone.childElementCount; i < suivi.pages.length; i++) {
    zone.insertAdjacentHTML('beforeend',
      baliseImage(doc, suivi.pages[i], i + 1, suivi.total || suivi.pages.length));
  }
}

/* Les pages s'affichent au fur et à mesure : la première est là en moins d'une
 * seconde, les suivantes arrivent pendant qu'elle lit. Le dessin va jusqu'au
 * bout même si elle referme le panneau ou change d'onglet, pour que le
 * prochain passage soit immédiat. */
async function rendreDoc(doc) {
  var suivi = etatDoc(doc);
  suivi.enCours = true;
  try {
    var pdfjsLib = await chargerPdfJs();
    var pdf = await pdfjsLib.getDocument(doc.fichier).promise;
    suivi.total = pdf.numPages;
    if (doc.cle === docCourant && !document.querySelector('#docs-corps .doc-pages')) {
      document.getElementById('docs-corps').innerHTML = '<div class="doc-pages"></div>';
    }
    for (var n = 1; n <= pdf.numPages; n++) {
      suivi.pages.push(await pageEnImage(await pdf.getPage(n)));
      completerAffichage(doc);
    }
    suivi.fini = true;
  } catch (e) {
    if (doc.cle === docCourant) {
      document.getElementById('docs-corps').innerHTML =
        lienDoc(doc, 'Ce document n\'a pas pu s\'afficher ici. Il s\'ouvre normalement avec ce bouton.');
    }
  } finally {
    suivi.enCours = false;
  }
}

function dessinerDoc() {
  var doc = docPar(docCourant);
  var suivi = etatDoc(doc);
  var corps = document.getElementById('docs-corps');
  if (suivi.pages.length) {
    corps.innerHTML = '<div class="doc-pages"></div>';
    completerAffichage(doc);
  } else {
    corps.innerHTML = '<p class="petit" style="margin:0;">Ouverture du document…</p>';
  }
  if (!suivi.enCours && !suivi.fini) rendreDoc(doc);
}

function dessinerOngletsDocs() {
  document.getElementById('docs-onglets').innerHTML = DOCUMENTS.map(function (d) {
    return '<button type="button" class="filtre onglet-doc" data-doc="' + echapper(d.cle) + '" ' +
      'aria-pressed="' + (d.cle === docCourant) + '">' + echapper(d.onglet) + '</button>';
  }).join('');
}

/* Changer de document ne referme pas le panneau : l'en-tête, le lien
 * « Ouvrir à part » et les pages suivent l'onglet choisi. Le panneau rouvre
 * sur le dernier document lu. */
function montrerDoc(cle) {
  docCourant = cle;
  var doc = docPar(cle);
  document.getElementById('docs-surtitre').textContent = doc.surtitre;
  document.getElementById('docs-titre').innerHTML = doc.titre;
  document.getElementById('docs-phrase').textContent = doc.phrase +
    ' Cliquez à côté de cette carte pour la refermer et retrouver votre fiche.';
  document.getElementById('docs-lien').href = doc.fichier;
  dessinerOngletsDocs();
  dessinerDoc();
}

function docsOuverts() {
  return !document.getElementById('docs').classList.contains('cache');
}

function ouvrirDocs() {
  montrerDoc(docCourant);
  document.getElementById('docs').classList.remove('cache');
  document.body.style.overflow = 'hidden';
  document.getElementById('bouton-fermer-docs').focus();
}

function fermerDocs() {
  document.getElementById('docs').classList.add('cache');
  document.body.style.overflow = '';
}

/* Ce que dit la barre repliée des vérifications, pour qu'elle sache sans ouvrir. */
function indiceVerifications() {
  var faits = (etat.habiteProximite ? 1 : 0) + (etat.venueHebdo ? 1 : 0);
  if (faits === 2) return 'Les deux points sont validés';
  if (faits === 1) return 'Un point sur deux';
  return 'Rien de validé';
}

/* Les trois points que le livret fait valider avant de placer un bilan. */
function blocVerifications(p) {
  var caseVerif = function (id, actif, libelle) {
    return '<button type="button" id="' + id + '" class="case" aria-pressed="' + (actif === true) + '">' +
      '<span class="carre"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 12.5 9.5 18 20 6.5"/></svg></span>' + echapper(libelle) + '</button>';
  };
  return '<details class="pliant">' +
    '<summary><span class="intitule">Ce qu\'il faut vérifier</span>' +
      '<span class="indice" id="indice-verifs">' + echapper(indiceVerifications()) + '</span></summary>' +
    '<div class="dedans-carte">' +
    '<p class="petit" style="margin:0 0 var(--space-4);">À valider avant de placer un bilan. ' +
      'Les antécédents médicaux se notent plus bas, avec l\'appel.</p>' +
    '<div style="display:grid; gap:var(--space-2);">' +
      caseVerif('btn-proximite', etat.habiteProximite, 'Elle habite ' + (etat.centre || 'la ville du centre') + ' ou les alentours') +
      caseVerif('btn-hebdo', etat.venueHebdo, 'Elle peut venir une fois par semaine au centre') +
    '</div>' +
    '</div>' +
  '</details>';
}

/* L'étape du process, d'après le statut. Null quand le livret ne fige aucun
 * message pour ce statut. */
function etapeDe(p) {
  return (p && ETAPE_DU_STATUT[p.statut]) || null;
}

function messageDejaLaisse(p) {
  var etape = etapeDe(p);
  var msg = etape && MESSAGES[etape];
  return !!(msg && msg.champ && p[msg.champ]);
}

/* Les deux appels du premier contact. Chaque bouton horodate son essai : le
 * bureau voit ainsi que les deux tentatives ont bien eu lieu, et à quelle heure.
 * Un essai déjà enregistré ne se décoche plus : il est en base, et le défaire
 * à l'écran ne le défait pas en face. */
function blocEssais(p) {
  var bouton = function (num, valeur, fige) {
    return '<button type="button" class="essai" data-essai="' + num + '"' +
      (fige ? ' disabled' : '') +
      ' aria-pressed="' + (!!valeur) + '">' +
      (num === 1 ? '1er appel' : '2e appel, 5 min après') +
      (valeur ? ' <span class="heure">' + echapper(formatHeure(valeur)) + '</span>' : '') +
    '</button>';
  };
  var reprise = premierContactIncomplet(p);
  return '<p class="petit" style="margin:0 0 var(--space-3);">' +
      (reprise
        ? 'Premier appel noté à ' + echapper(formatHeure(p.appel1)) + '. Il reste le second, cinq minutes après.'
        : 'Le premier contact, c\'est deux appels à cinq minutes d\'écart. Vous pouvez enregistrer après le premier et revenir noter le second.') +
    '</p>' +
    '<div class="essais">' + bouton(1, etat.essai1, !!(p && p.appel1)) +
      bouton(2, etat.essai2, !!(p && p.appel1Bis)) + '</div>';
}

/* Le message à laisser quand personne ne décroche, selon l'étape du prospect.
 * Au premier contact il ne vient qu'une fois les deux appels passés : le
 * livret demande deux tentatives avant la note vocale, pas une. */
function blocMessage(p) {
  if (deuxiemeAppelManque()) {
    return '<p class="petit" style="margin:0;">Il reste le deuxième appel, cinq minutes après le premier. ' +
      'La note vocale vient après les deux, pas avant.<br>' +
      'Enregistrez dès maintenant si vous préférez : la fiche vous attend en haut de la liste, au même statut.</p>';
  }
  var etape = etapeDe(p);
  var msg = etape && MESSAGES[etape];
  if (!msg) {
    return '<p class="petit" style="margin:0;">Le livret ne fige pas de message à cette étape : ' +
      'relancez-la en fonction de son retour.</p>';
  }
  return '<p class="surtitre-carte" style="margin:0 0 var(--space-2);">' + echapper(msg.titre) + '</p>' +
    '<p class="petit" style="margin:0 0 var(--space-3);">' + echapper(msg.sous) + '</p>' +
    (msg.texte
      ? '<div class="script">' + remplir(msg.texte, p) + '</div>'
      : '<p class="script script-manquant">' + echapper(msg.consigne) + '</p>') +
    (msg.champ
      ? '<div style="margin-top:var(--space-3);">' +
          '<button type="button" id="btn-message" class="case" aria-pressed="' + (etat.messageEtape === true) + '">' +
            '<span class="carre"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M4 12.5 9.5 18 20 6.5"/></svg></span>' + echapper(msg.case) +
          '</button>' +
        '</div>'
      : '');
}

function blocFormulaire(p) {
  var f = p.formulaire || {};
  var lignes = [
    ['Son objectif', f.objectif],
    ['Kilos à perdre', f.kilos],
    ['Son problème principal', f.probleme],
    ['Quand la rappeler', f.quand],
  ].filter(function (l) { return l[1] && String(l[1]).trim(); });

  if (lignes.length === 0) return '';

  return '<div class="carte">' +
    '<p class="surtitre-carte">Ce qu\'elle a répondu</p>' +
    '<dl style="margin:0;">' + lignes.map(function (l) {
      return '<div class="paire"><dt>' + echapper(l[0]) + '</dt><dd>' + echapper(l[1]) + '</dd></div>';
    }).join('') + '</dl></div>';
}

/* L'historique des appels passés. Chaque note peut être corrigée sur place :
 * une faute de frappe ou un détail oublié se rattrape sans toucher à l'heure
 * ni à la date de l'appel — on n'envoie que la note. Le cycle en cours fait
 * exception : il se corrige dans le formulaire juste en dessous, et deux
 * champs pour la même note se marcheraient dessus. */
function blocHistorique(p) {
  var cycles = [1, 2, 3].filter(function (n) { return p['appel' + n] || p['notes' + n]; });
  if (cycles.length === 0) {
    return '<div class="carte"><p class="surtitre-carte">Historique</p>' +
      '<p class="petit" style="margin:0;">Personne ne l\'a encore appelée.</p></div>';
  }
  var enCours = prochainCycle(p);
  return '<div class="carte">' +
    '<p class="surtitre-carte">Historique des appels</p>' +
    cycles.map(function (n) {
      var repondu = p['repondu' + n];
      var note = p['notes' + n] || '';
      var corrigeable = n < enCours;
      var enEdition = etat.noteEnEdition === n;
      return '<div class="cycle">' +
        '<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">' +
          '<span class="cycle-numero">' + n + '</span>' +
          '<span class="corps-fort">' + echapper(formatDateHeure(p['appel' + n])) + '</span>' +
          (n === 1 && p.appel1Bis ? '<span class="petit">2e essai à ' + echapper(formatHeure(p.appel1Bis)) + '</span>' : '') +
          (n === 1 && premierContactIncomplet(p) ? '<span class="petit">2e appel à passer</span>' : '') +
          (p['therapeute' + n] ? '<span class="petit">par ' + echapper(p['therapeute' + n]) + '</span>' : '') +
          '<span class="etiquette ' + (repondu ? 'et-mesure' : 'et-factuelle') + '" style="margin-left:auto;">' +
            (repondu ? 'A répondu' : 'Pas de réponse') + '</span>' +
        '</div>' +
        (enEdition
          ? '<textarea id="champ-note-' + n + '" class="champ" style="min-height:80px; margin-top:var(--space-3);" ' +
              'placeholder="Ce qu\'elle vous a dit, ce qu\'elle attend, ce qui bloque…">' + echapper(note) + '</textarea>' +
            '<div style="display:flex; gap:var(--space-2); margin-top:var(--space-3);">' +
              '<button type="button" class="bouton-note" data-note-ok="' + n + '">Enregistrer la note</button>' +
              '<button type="button" class="lien-fermer" data-note-annuler="' + n + '">Annuler</button>' +
            '</div>' +
            '<p class="petit" style="margin:var(--space-2) 0 0;">L\'heure et la date de l\'appel ne bougent pas.</p>'
          : (note
              ? '<p class="petit" style="margin:var(--space-3) 0 0; white-space:pre-wrap; color:var(--encre);">' +
                echapper(note) + '</p>'
              : (corrigeable ? '<p class="petit" style="margin:var(--space-3) 0 0;">Pas de note.</p>' : '')) +
            (corrigeable
              ? '<button type="button" class="lien-note" data-note="' + n + '">' +
                (note ? 'Modifier la note' : 'Ajouter une note') + '</button>'
              : '')) +
        '</div>';
    }).join('') + '</div>';
}

function dessinerHistorique() {
  var zone = document.getElementById('historique');
  if (!zone || !etat.selection) return;
  zone.innerHTML = blocHistorique(etat.selection);
  brancherHistorique();
}

function brancherHistorique() {
  var zone = document.getElementById('historique');
  if (!zone) return;
  Array.prototype.forEach.call(zone.querySelectorAll('[data-note]'), function (b) {
    b.onclick = function () {
      etat.noteEnEdition = Number(b.getAttribute('data-note'));
      dessinerHistorique();
      var champ = document.getElementById('champ-note-' + etat.noteEnEdition);
      if (champ) { champ.focus(); champ.setSelectionRange(champ.value.length, champ.value.length); }
    };
  });
  Array.prototype.forEach.call(zone.querySelectorAll('[data-note-annuler]'), function (b) {
    b.onclick = function () { etat.noteEnEdition = null; dessinerHistorique(); };
  });
  Array.prototype.forEach.call(zone.querySelectorAll('[data-note-ok]'), function (b) {
    b.onclick = function () { enregistrerNote(Number(b.getAttribute('data-note-ok'))); };
  });
}

/* On n'envoie que la note : ni date d'appel, ni suite. La fonction n'écrit la
 * trace « depuis centre » et le prénom de la thérapeute que sur les cycles dont
 * la requête porte la date — l'appel d'origine garde donc sa signature. */
async function enregistrerNote(n) {
  var p = etat.selection;
  if (!p || etat.envoiEnCours) return;
  var champ = document.getElementById('champ-note-' + n);
  if (!champ) return;

  var bouton = document.querySelector('[data-note-ok="' + n + '"]');
  var modifs = {};
  modifs['notes' + n] = champ.value;

  etat.envoiEnCours = true;
  if (bouton) { bouton.disabled = true; bouton.textContent = 'Enregistrement…'; }
  try {
    var data = await api('modifier', { recordId: p.id, modifs: modifs });
    var maj = data.prospect;
    var i = etat.prospects.findIndex(function (x) { return x.id === maj.id; });
    if (i >= 0) etat.prospects[i] = maj;
    etat.selection = maj;
    etat.noteEnEdition = null;
    message('Note de l\'appel ' + n + ' modifiée');
    dessinerHistorique();
    dessinerListe();
  } catch (e) {
    message(e.message || 'La note n\'a pas pu être enregistrée', 'erreur');
    if (bouton) { bouton.disabled = false; bouton.textContent = 'Enregistrer la note'; }
  } finally {
    etat.envoiEnCours = false;
  }
}

  var p = etat.selection;

  if (!p) {
    conteneur.innerHTML = '<div class="vide">' +

      '</div>';

  var u = rangUrgence(p);
  var et = etiquettePriorite(p);

  conteneur.innerHTML =
    // -------- Identité, sur la surface profonde
    '<div class="carte-identite">' +
      '<div class="rangee-etiquettes" style="margin-bottom:var(--space-4);">' +
        (p.statut
          ? '<span class="etiquette et-statut">' + echapper(p.statut) +
            (depuisQuand(p.statutDepuis) ? ' · ' + echapper(depuisQuand(p.statutDepuis)) : '') + '</span>'
          : '') +
        '<span class="etiquette et-profond"><span class="point" style="background:' + couleurUrgence(u) + ';"></span>' +
          echapper(et.texte) + '</span>' +
        (p.soin ? '<span class="etiquette et-profond">' + echapper(p.soin) + '</span>' : '') +
        (p.source ? '<span class="etiquette et-profond">' + echapper(p.source) + '</span>' : '') +
      '</div>' +
      '<h1>' + echapper(prenom) + (nomFamille ? ' <b>' + echapper(nomFamille) + '</b>' : '') + '</h1>' +
      (tel
        ? '<a class="bouton-appel" href="tel:' + echapper(String(p.telephone).replace(/\s/g, '')) + '">' + icone + echapper(tel) + '</a>'
        : '<p style="margin:0; color:var(--profond-doux);">Pas de numéro de téléphone</p>') +
      '<dl class="infos-profond">' +
        (p.email ? '<div><dt>E-mail</dt><dd>' + echapper(p.email) + '</dd></div>' : '') +
        '<div><dt>Arrivée</dt><dd>' + echapper(formatDate(p.creation)) +
          (depuis(p.creation) ? ' <span style="color:var(--profond-source);">(' + echapper(depuis(p.creation)) + ')</span>' : '') + '</dd></div>' +
        '<div><dt>D\'où elle vient</dt><dd>' + echapper(p.source || 'Non précisé') + '</dd></div>' +
        (p.commercial ? '<div><dt>Suivie au bureau par</dt><dd>' + echapper(p.commercial) + '</dd></div>' : '') +
      '</dl>' +
      (p.commentaire ? '<div class="note-bureau">' +
        '<p class="surtitre-carte" style="color:var(--aqua-clair); margin-bottom:6px;">Note du bureau</p>' +
        '<p style="margin:0; white-space:pre-wrap; font:400 15px/22px var(--font-sans); color:var(--profond-texte);">' +
        echapper(p.commentaire) + '</p></div>' : '') +

    blocFormulaire(p) +
    blocVerifications(p) +
    '<div id="historique">' + blocHistorique(p) + '</div>' +

    // -------- Saisie de l'appel
    '<div class="carte">' +
      '<p class="surtitre-carte">Appel ' + n + '</p>' +
      '<p class="titre-4" style="margin:0 0 var(--space-5);">Comment s\'est passé votre appel ?</p>' +

      // Le premier contact, c'est deux appels à cinq minutes d'écart.
      (n === 1 ? blocEssais(p) : '') +

      '<div style="display:flex; gap:var(--space-3); flex-wrap:wrap; margin-bottom:var(--space-5);">' +
        '<button type="button" id="btn-repondu" class="choix" aria-pressed="' + (etat.resultat === true) + '"><span class="rond"></span>Elle a répondu</button>' +
        '<button type="button" id="btn-sans-reponse" class="choix" aria-pressed="' + (etat.resultat === false) + '"><span class="rond"></span>Pas de réponse</button>' +
      '</div>' +

      // Personne n'a décroché : le message de l'étape, avec son texte.
      '<div id="bloc-message" style="margin-bottom:var(--space-5);' +
        (etat.resultat === false ? '' : 'display:none;') + '">' + blocMessage(p) + '</div>' +

      '<label class="libelle" for="champ-notes">Ce qu\'il faut retenir</label>' +
      '<textarea id="champ-notes" class="champ" placeholder="Ce qu\'elle vous a dit, ce qu\'elle attend, ce qui bloque…">' +
        echapper(p['notes' + n] || '') + '</textarea>' +

      // Les antécédents s'apprennent pendant l'appel : ils se notent ici,
      // sous ce qu'elle vient de dire, et non dans un pliant ouvert avant.
      '<label class="libelle" for="champ-antecedents" style="margin-top:var(--space-4);">Antécédents médicaux</label>' +
      '<textarea id="champ-antecedents" class="champ" style="min-height:80px;" ' +
        'placeholder="Cancer, épilepsie, pacemaker, plaque métallique… Laissez vide si rien n\'est signalé.">' +
        echapper(etat.antecedents) + '</textarea>' +
      '<p class="alerte" style="margin:var(--space-3) 0 0;">Cancer de moins de 5 ans : demander un avis médical ' +
