      '<p class="surtitre-carte" style="margin:var(--space-6) 0 var(--space-3);">Et maintenant ?</p>' +
      '<div class="grille-3">' +
        suitesPour(p).map(function (su) {
          return '<button type="button" class="choix choix-bloc" data-suite="' + su.cle + '"' +
            (su.relance ? ' data-relance="1"' : '') +
            (su.relance && deuxiemeAppelManque() ? ' disabled' : '') +
            ' aria-pressed="' + (etat.suite === su.cle) + '">' +
            '<span class="rond"></span>' +
            '<b>' + echapper(su.titre) + '</b>' +
            '<span class="sous">' + echapper(su.sous) + '</span>' +
          '</button>';
        }).join('') +
      '</div>' +
      '<div id="bloc-suite" style="margin-top:var(--space-4);"></div>' +
    '</div>' +

    // -------- Barre d'enregistrement, toujours visible
    '<div class="barre-action">' +
      '<span class="corps-fort" style="min-width:0;">' + echapper(nomComplet) + '</span>' +
      '<div style="flex:1;"></div>' +
      '<span id="aide-enregistrer" class="petit" style="margin:0;">' +
        (etat.resultat === null ? 'Indiquez d\'abord si elle a répondu.' : '') + '</span>' +
      '<button type="button" id="btn-enregistrer" class="bouton-primaire"' + (etat.resultat === null ? ' disabled' : '') + '>Enregistrer l\'appel</button>' +
    '</div>';

  document.getElementById('btn-repondu').onclick = function () { choisirResultat(true); };
  document.getElementById('btn-sans-reponse').onclick = function () { choisirResultat(false); };
  document.getElementById('btn-enregistrer').onclick = enregistrerAppel;
  brancherBoutonMessage();
  brancherHistorique();

  Array.prototype.forEach.call(conteneur.querySelectorAll('[data-essai]'), function (b) {
    b.onclick = function () {
      var num = b.getAttribute('data-essai');
      var cle = num === '1' ? 'essai1' : 'essai2';
      etat[cle] = etat[cle] ? null : new Date().toISOString();
      b.setAttribute('aria-pressed', String(!!etat[cle]));
      var heure = b.querySelector('.heure');
      if (etat[cle] && !heure) b.insertAdjacentHTML('beforeend', ' <span class="heure">' + echapper(formatHeure(etat[cle])) + '</span>');
      else if (!etat[cle] && heure) heure.remove();
      // Le second appel ouvre le message et la relance ; le décocher les referme.
      if (cle === 'essai2') majPremierContact();
    };
  });

  var basculer = function (id, cle) {
    var b = document.getElementById(id);
    if (!b) return;
    b.onclick = function () {
      etat[cle] = !etat[cle];
      b.setAttribute('aria-pressed', String(etat[cle]));
      var indice = document.getElementById('indice-verifs');
      if (indice) indice.textContent = indiceVerifications();
    };
  };
  basculer('btn-proximite', 'habiteProximite');
  basculer('btn-hebdo', 'venueHebdo');

  var champAnte = document.getElementById('champ-antecedents');
  if (champAnte) champAnte.oninput = function () { etat.antecedents = champAnte.value; };
  Array.prototype.forEach.call(conteneur.querySelectorAll('[data-suite]'), function (b) {
    b.onclick = function () { choisirSuite(b.getAttribute('data-suite')); };
  });
  dessinerSuite(false);
  majAideEnregistrer();
}

/** Un deuxième clic sur la carte déjà choisie annule le choix. */
function choisirSuite(cle) {
  etat.suite = (etat.suite === cle) ? null : cle;
  etat.suiteAuto = false;
  etat.suiteDate = '';
  majCartesSuite(true);
}

/** Remet les cartes et le bloc du dessous d'accord avec etat.suite. */
function majCartesSuite(donnerLeFocus) {
  Array.prototype.forEach.call(document.querySelectorAll('[data-suite]'), function (b) {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-suite') === etat.suite));
  });
  dessinerSuite(donnerLeFocus);
}

/** Le champ de date de la suite choisie, ou le rappel de ce qui se passera sans choix. */
function dessinerSuite(donnerLeFocus) {
  var bloc = document.getElementById('bloc-suite');
  if (!bloc) return;
  var p = etat.selection;
  var su = suiteChoisie();

  if (!su) {
    bloc.innerHTML = '<p class="petit" style="margin:0;">Sans choix, l\'appel est enregistré et la fiche reste telle quelle dans votre liste.' +
      (p && p.prochainRappel ? ' Un rappel est déjà noté pour le ' + echapper(formatDateHeure(p.prochainRappel)) + '.' : '') +
      '</p>';
    return;
  }

  // Seules les suites datées ouvrent un champ ; les autres se résument à une phrase.
  if (!su.libelleDate) {
    bloc.innerHTML = '<p class="petit" style="margin:0;"><b>' + echapper(su.titre) + '</b> · ' +
      echapper(su.resume) + '</p>';
    return;
  }

  bloc.innerHTML =
    '<label class="libelle" for="champ-suite">' + echapper(su.libelleDate) + '</label>' +
    '<input id="champ-suite" class="champ" type="datetime-local" value="' + echapper(etat.suiteDate) + '">' +
    '<p class="petit" style="margin:var(--space-2) 0 0;">' + echapper(su.resume) + '</p>';

  var champ = document.getElementById('champ-suite');
  champ.oninput = function () {
    etat.suiteDate = champ.value;
    champ.classList.remove('champ-erreur');
  };
  if (donnerLeFocus) champ.focus();
}

/* Le texte à côté du bouton d'enregistrement : ce qui manque encore, s'il manque
 * quelque chose. Le SMS n'est qu'un rappel — il n'empêche jamais d'enregistrer. */
function majAideEnregistrer() {
  var aide = document.getElementById('aide-enregistrer');
  if (!aide) return;
  var p = etat.selection;
  var etape = etapeDe(p);
  var msg = etape && MESSAGES[etape];
  var messageAttendu = etat.resultat === false && msg && msg.champ && !etat.messageEtape;
  aide.textContent = etat.resultat === null ? 'Indiquez d\'abord si elle a répondu.'
    : deuxiemeAppelManque() ? 'Vous pouvez enregistrer : le 2e appel se note à votre retour.'
    : messageAttendu ? 'Pensez à ' + (etape === 'contact' ? 'la note vocale.' : 'envoyer le SMS.')
    : '';
}

/* Le bouton de la case vit dans un bloc redessiné : on le rebranche à chaque fois. */
function brancherBoutonMessage() {
  var btn = document.getElementById('btn-message');
  if (!btn) return;
  btn.onclick = function () {
    etat.messageEtape = !etat.messageEtape;
    btn.setAttribute('aria-pressed', String(etat.messageEtape));
    majAideEnregistrer();
  };
}

function choisirResultat(valeur) {
  etat.resultat = valeur;
  document.getElementById('btn-repondu').setAttribute('aria-pressed', String(valeur === true));
  document.getElementById('btn-sans-reponse').setAttribute('aria-pressed', String(valeur === false));
  document.getElementById('btn-enregistrer').disabled = false;

  var bloc = document.getElementById('bloc-message');
  if (bloc) bloc.style.display = (valeur === false) ? '' : 'none';
  majAideEnregistrer();

  // « Pas de réponse » vaut une relance de plus : la carte se coche d'elle-même,
  // pour que la thérapeute n'ait qu'un geste à faire. Elle reste libre de la
  // décocher ou d'en choisir une autre, et son choix à elle n'est jamais défait.
  // Au premier contact, rien ne se coche tant que le second appel n'est pas
  // noté : une seule tentative ne fait pas passer en R2.
  if (valeur === false && !etat.suite && !deuxiemeAppelManque()) {
    etat.suite = suitesPour(etat.selection)[0].cle;
    etat.suiteAuto = true;
  } else if (valeur === true && etat.suiteAuto) {
    etat.suite = null;
    etat.suiteAuto = false;
  }
  majPremierContact();
  majCartesSuite(false);
}

/* Ce que le second appel change à l'écran, sans redessiner la fiche : le
 * message, la carte de relance, et la phrase de la barre d'enregistrement.
 * Appelée quand on coche un essai et quand on dit si elle a répondu. */
function majPremierContact() {
  var p = etat.selection;
  if (!p) return;
  var manque = deuxiemeAppelManque();

  var bloc = document.getElementById('bloc-message');
  if (bloc) {
    bloc.innerHTML = blocMessage(p);
    brancherBoutonMessage();
  }

  var relance = document.querySelector('[data-relance]');
  if (relance) {
    relance.disabled = manque;
    // La relance cochée d'office saute si le second appel redevient à passer.
    if (manque && etat.suiteAuto && etat.suite === relance.getAttribute('data-suite')) {
      etat.suite = null;
      etat.suiteAuto = false;
      majCartesSuite(false);
    }
    // Les deux appels sont là, personne n'a décroché : la relance se coche.
    if (!manque && etat.resultat === false && !etat.suite) {
      etat.suite = relance.getAttribute('data-suite');
      etat.suiteAuto = true;
      majCartesSuite(false);
    }
  }
  majAideEnregistrer();
}

async function enregistrerAppel() {
  if (etat.envoiEnCours || etat.resultat === null || !etat.selection) return;

  if (!etat.prenom) {
    document.getElementById('aide-enregistrer').textContent = 'Indiquez votre prénom en haut à droite.';
    var champPrenom = document.getElementById('champ-prenom-barre');
    if (champPrenom) champPrenom.focus();
    return;
  }
  var p = etat.selection;
  var n = prochainCycle(p);
  var bouton = document.getElementById('btn-enregistrer');

  var modifs = {};
  // Au premier contact, l'heure vient des boutons d'essai quand elle les a
  // utilisés. Si la fiche porte déjà son premier appel, c'est qu'on revient
  // le compléter : on n'y touche pas, on ajoute le second essai.
  modifs['appel' + n] = (n === 1 && (p.appel1 || etat.essai1)) || new Date().toISOString();
  if (n === 1 && etat.essai2) modifs.appel1Bis = etat.essai2;
  modifs['repondu' + n] = etat.resultat;
  modifs['notes' + n] = document.getElementById('champ-notes').value;

  // Le message de l'étape, et les points vérifiés pendant l'appel.
  var etapeCourante = etapeDe(p);
  var msgCourant = etapeCourante && MESSAGES[etapeCourante];
  if (etat.resultat === false && msgCourant && msgCourant.champ) {
    modifs[msgCourant.champ] = etat.messageEtape === true;
  }
  modifs.habiteProximite = etat.habiteProximite === true;
  modifs.venueHebdo = etat.venueHebdo === true;
  modifs.antecedents = etat.antecedents;

  // La suite choisie décide du statut, côté serveur. Sans date, on n'envoie rien :
  // un statut sans son rendez-vous ne veut rien dire.
  var suiteFaite = suiteChoisie();
  if (suiteFaite) {
    modifs.suite = suiteFaite.cle;
    if (suiteFaite.libelleDate) {
      var champSuite = document.getElementById('champ-suite');
      var quand = champSuite ? champSuite.value : '';
      if (!quand) {
        message('Indiquez la date avant d\'enregistrer', 'erreur');
        if (champSuite) { champSuite.classList.add('champ-erreur'); champSuite.focus(); }
        return;
      }
      modifs.suiteDate = new Date(quand).toISOString();
    }
  }

  etat.envoiEnCours = true;
  bouton.disabled = true;
  bouton.textContent = 'Enregistrement…';

  try {
    var data = await api('modifier', { recordId: p.id, modifs: modifs });
    var maj = data.prospect;
    var i = etat.prospects.findIndex(function (x) { return x.id === maj.id; });
    var texte = !suiteFaite ? 'Appel enregistré'
      : suiteFaite.libelleDate ? suiteFaite.titre + ' · ' + formatDateHeure(modifs.suiteDate)
      : 'Passée en ' + suiteFaite.titre;
    etat.suite = null;
    etat.suiteAuto = false;
    etat.suiteDate = '';
    etat.messageEtape = !!messageDejaLaisse(maj);
    // Les essais repartent de la fiche enregistrée, pas de zéro : sans ça, le
    // premier appel qu'on vient de noter reviendrait vierge et verrouillé,
    // comme s'il était indisponible au lieu d'être fait.
    etat.essai1 = maj.appel1 || null;
    etat.essai2 = maj.appel1Bis || null;
    etat.noteEnEdition = null;
    etat.habiteProximite = !!maj.habiteProximite;
    etat.venueHebdo = !!maj.venueHebdo;
    etat.antecedents = maj.antecedents || '';

    // Le prospect sort de la liste dès qu'il quitte la pile d'appels.
    var resteAAppeler = STATUTS_LISTE.indexOf(maj.statut) >= 0;
    if (!resteAAppeler) {
      if (i >= 0) etat.prospects.splice(i, 1);
      etat.selection = null;
    } else {
      if (i >= 0) etat.prospects[i] = maj;
      etat.selection = maj;
      etat.resultat = null;
    }
    message(texte);
    dessinerListe();
    dessinerFiche();
  } catch (e) {
    message(e.message, 'erreur');
    bouton.disabled = false;
    bouton.textContent = 'Enregistrer l\'appel';
  } finally {
    etat.envoiEnCours = false;
  }
}

/* ---------------------------------------------------------------- Chargement */

async function charger() {
  try {
    var data = await api('liste');
    etat.centre = data.centre;
    etat.prospects = data.prospects || [];
    document.getElementById('nom-centre').textContent = data.centre;
    rafraichirListeBarre();
    if (etat.selection) {
      var encore = etat.prospects.find(function (x) { return x.id === etat.selection.id; });
      etat.selection = encore || null;
    }
    dessinerListe();
    dessinerFiche();
  } catch (e) {
    if (/code/i.test(e.message)) { quitter(); return; }
    message(e.message, 'erreur');
  }
}

/* ---------------------------------------------------------------- Connexion */

async function connecter() {
  var champ = document.getElementById('champ-code');
  var champPrenom = document.getElementById('champ-prenom');
  var choixPrenom = document.getElementById('choix-prenom');
  var visiblePrenom = choixPrenom.classList.contains('cache') ? champPrenom : choixPrenom;
  var erreur = document.getElementById('erreur-code');
  var bouton = document.getElementById('bouton-connexion');
  var code = champ.value.trim();
  var prenom = champPrenom.value.trim();

  erreur.classList.add('cache');
  champ.classList.remove('champ-erreur');
  visiblePrenom.classList.remove('champ-erreur');
  if (!prenom) {
    erreur.textContent = 'Choisissez votre prénom : il signera vos appels dans le CRM.';
    erreur.classList.remove('cache');
    visiblePrenom.classList.add('champ-erreur');
    visiblePrenom.focus();
    return;
  }
  if (!code) {
    erreur.textContent = 'Saisissez le code de votre centre.';
    erreur.classList.remove('cache');
    champ.classList.add('champ-erreur');
    return;
  }

  enregistrerPrenom(prenom);

  bouton.disabled = true;
  bouton.textContent = 'Vérification…';
  etat.code = code;

  try {
    var data = await api('connexion');
    etat.centre = data.centre;
    try { localStorage.setItem(CLE_CODE, code); } catch (e) { /* navigation privée */ }
    ouvrirEspace();
    await charger();
  } catch (e) {
    etat.code = null;
    erreur.textContent = e.message;
    erreur.classList.remove('cache');
    champ.classList.add('champ-erreur');
  } finally {
    bouton.disabled = false;
    bouton.textContent = 'Accéder à mes appels';
  }
}

// Le prénom vit dans le navigateur : saisi une fois, modifiable à tout moment
// depuis la barre du haut.
function enregistrerPrenom(prenom) {
  etat.prenom = String(prenom || '').trim().slice(0, 40);
  try { localStorage.setItem(CLE_PRENOM, etat.prenom); } catch (e) { /* navigation privée */ }
}

// Celles qui étaient déjà connectées ne repassent pas par l'écran de connexion :
// leur navigateur a gardé le code mais pas de prénom. On attire l'œil sur le
// champ plutôt que de les laisser le découvrir au premier enregistrement.
function signalerPrenomManquant() {
  var champ = document.getElementById('choix-prenom-barre');
  if (champ && champ.classList.contains('cache')) champ = document.getElementById('champ-prenom-barre');
  if (!champ || etat.prenom) return;
  champ.classList.add('a-remplir');
  champ.focus();
}

function ouvrirEspace() {
  document.getElementById('connexion').classList.add('cache');
  document.getElementById('espace').classList.remove('cache');
  document.getElementById('nom-centre').textContent = etat.centre || '';
  document.getElementById('champ-prenom-barre').value = etat.prenom;
  rafraichirListeBarre();
}

// Le centre n'est connu qu'au retour du serveur : au rechargement, la barre
// s'ouvre avant, et la liste doit être refaite une fois le centre arrivé.
function rafraichirListeBarre() {
  var choixBarre = document.getElementById('choix-prenom-barre');
  var champLibre = document.getElementById('champ-prenom-barre');
  if (!choixBarre || !champLibre) return;
  // Si elle a choisi « Autre… », on ne lui reprend pas son champ libre.
  if (!champLibre.classList.contains('cache')) return;
  remplirListeTherapeutes(choixBarre, etat.centre, etat.prenom);
  choixBarre.classList.remove('cache');
}

function quitter() {
  // Le poste est partagé : on efface aussi le prénom, la suivante saisira le sien.
  try { localStorage.removeItem(CLE_CODE); localStorage.removeItem(CLE_PRENOM); } catch (e) { /* ignoré */ }
  etat.code = null; etat.centre = null; etat.prenom = ''; etat.prospects = []; etat.selection = null;
  document.getElementById('espace').classList.add('cache');
  document.getElementById('connexion').classList.remove('cache');
  document.getElementById('champ-code').value = '';
  document.getElementById('champ-prenom').value = '';
  document.getElementById('champ-prenom').classList.add('cache');
  var choix = document.getElementById('choix-prenom');
  choix.classList.remove('cache');
  remplirListeTherapeutes(choix, null, '');
}

/* ---------------------------------------------------------------- Démarrage */

(function demarrer() {
  document.getElementById('bouton-connexion').onclick = connecter;
  document.getElementById('champ-code').onkeydown = function (e) { if (e.key === 'Enter') connecter(); };
  document.getElementById('champ-prenom').onkeydown = function (e) { if (e.key === 'Enter') document.getElementById('champ-code').focus(); };

  // Les deux listes : celle de la connexion (tous les centres) et celle de la barre (son centre).
  remplirListeTherapeutes(document.getElementById('choix-prenom'), null, '');
  brancherChoixPrenom(document.getElementById('choix-prenom'), document.getElementById('champ-prenom'), null);
  brancherChoixPrenom(document.getElementById('choix-prenom-barre'), document.getElementById('champ-prenom-barre'), function (valeur) {
    enregistrerPrenom(valeur);
    var cible = document.getElementById('choix-prenom-barre').classList.contains('cache')
      ? document.getElementById('champ-prenom-barre')
      : document.getElementById('choix-prenom-barre');
    cible.classList.toggle('a-remplir', !etat.prenom);
    if (etat.prenom) {
      var aide = document.getElementById('aide-enregistrer');
      if (aide && /prénom/.test(aide.textContent)) aide.textContent = '';
    }
  });
  document.getElementById('bouton-quitter').onclick = quitter;
  document.getElementById('bouton-rafraichir').onclick = charger;
  document.getElementById('bouton-docs').onclick = ouvrirDocs;
  document.getElementById('bouton-fermer-docs').onclick = fermerDocs;
  document.getElementById('docs-onglets').onclick = function (e) {
    var onglet = e.target.closest('[data-doc]');
    if (onglet) montrerDoc(onglet.dataset.doc);
  };

  // Un clic à côté de la carte la referme : c'est le geste le plus court pour
  // revenir aux informations du client. Le clic dans la carte, lui, ne compte pas.
  document.getElementById('docs').onclick = function (e) {
    if (e.target === this) fermerDocs();
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && docsOuverts()) fermerDocs();
  });
  document.getElementById('champ-recherche').oninput = function (e) {
    etat.recherche = e.target.value;
    dessinerListe();
  };

  var garde = null;
  try {
    garde = localStorage.getItem(CLE_CODE);
    etat.prenom = localStorage.getItem(CLE_PRENOM) || '';
  } catch (e) { /* ignoré */ }
  if (garde) {
    etat.code = garde;
    ouvrirEspace();
    charger();
    signalerPrenomManquant();
  } else if (etat.prenom) {
    document.getElementById('champ-prenom').value = etat.prenom;
    remplirListeTherapeutes(document.getElementById('choix-prenom'), null, etat.prenom);
  }

  // Rafraîchissement discret : la liste du bureau bouge pendant la journée.
  setInterval(function () { if (etat.code && !etat.envoiEnCours) charger(); }, 180000);
})();
</script>
